[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomoreveal"
dynamic = ["version"]
description = "Slice-sweep and segmentation-reveal movies for cryo-ET tomograms (Dragonfly sessions, easymode output, label volumes)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "vtk>=9.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    "mrcfile>=1.5",
    "tifffile>=2023.7",
    "zstandard>=0.22",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
tomoreveal = "tomoreveal.cli:main"

[tool.setuptools]
packages = ["tomoreveal"]

[tool.setuptools.dynamic]
version = {attr = "tomoreveal.common.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
