name: tomoreveal
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pyside6
  - pyvista
  - vtk
  - numpy
  - libblas=*=*openblas  # MKL 2026.1's threaded calls crash NumPy on Windows (0xC06D007F)
  - scipy
  - scikit-image
  - imageio
  - imageio-ffmpeg
  - mrcfile
  - tifffile
  - zstandard
  - pillow
  - pytest
